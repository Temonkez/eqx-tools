
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EQX Tools | Tactical Equinox</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101827;
      color: #e9edf5;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #182740;
      text-align: center;
      padding: 48px 20px;
      border-bottom: 2px solid #879bb7;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 3px;
    }

    header p {
      color: #b9c8dc;
      margin-bottom: 0;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 32px 20px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .tool {
      background: #1c2d47;
      border: 1px solid #536984;
      border-radius: 12px;
      padding: 25px;
      text-decoration: none;
      color: inherit;
      transition: background .2s;
    }

    .tool:hover {
      background: #293e5d;
    }

    .tool h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .tool p {
      color: #b9c8dc;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #91a4bf;
      padding: 30px 15px;
      font-size: 13px;
    }
    .eqx-logo {
  display: block;
  width: 130px;
  height: auto;
  margin: 0 auto 20px;
    }
  </style>
</head>
<body>

  <header>
    <img src="eqx-logo.png" alt="Tactical Equinox Logo" class="eqx-logo">
    <h1>EQX TOOLS</h1>
    <p>Tactical Equinox | Tacticus Community Tools</p>
  </header>

  <main>
    <div class="tools">

      <a href="eqx_battlefield_planner_.html" style="text-decoration:none; color:inherit;">
  <div class="card">
    <h2>Battlefield Planner</h2>
    <p>Plan Guild War defences, assign players and export battlefield layouts.</p>
  </div>
      </a>

      <a class="tool" href="team-builder/">
        <h2>Team Builder</h2>
        <p>Create character lineups and export clean team images for Discord.</p>
      </a>

    </div>
  </main>

  <footer>
    Powered by EQX
  </footer>

</body>
  </html>
