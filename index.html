
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081b33">
<title>EQX Tools | Tactical Equinox</title>

<style>
:root{
  color-scheme:dark;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#f4f6fb;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100dvh;
  background:#0a1d34;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(90deg,transparent 49.85%,rgba(255,255,255,.06) 50%,transparent 50.15%),
    linear-gradient(90deg,#06182e 0%,#0a2748 49.9%,#8dc3ed 50%,#a8d1f3 100%);
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  opacity:.10;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 18% 13%,#15549d,transparent 42%),
    radial-gradient(ellipse at 79% 77%,#1b5f9c,transparent 62%);
}

.wrap{
  width:min(100%,900px);
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

.hero{
  text-align:center;
  padding:34px 16px 24px;
  border-bottom:2px solid rgba(242,246,255,.9);
}

.logo{
  width:clamp(145px,30vw,220px);
  height:auto;
  display:block;
  margin:0 auto 16px;
  filter:drop-shadow(0 6px 13px rgba(0,0,0,.4));
}

h1{
  font-size:clamp(40px,8.5vw,68px);
  font-weight:750;
  letter-spacing:.09em;
  line-height:1.06;
  margin:0 0 10px;
  text-shadow:0 1px 2px rgba(0,12,28,.28);
}

.subtitle{
  font-size:clamp(15px,3.7vw,25px);
  margin:0;
  color:#ffffff;
  text-shadow:0 1px 2px rgba(0,12,28,.65);
}

.tools{
  padding:28px clamp(20px,5.4vw,46px) 30px;
  display:grid;
  gap:22px;
  flex:1;
  align-content:start;
}

.tool{
  background:linear-gradient(115deg,rgba(20,43,71,.97),rgba(20,44,73,.96));
  border:1.5px solid #7c94b3;
  border-radius:20px;
  min-height:238px;
  padding:30px clamp(24px,5vw,42px);
  box-shadow:0 2px 5px rgba(0,16,36,.15);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.tool h2{
  font-size:clamp(24px,4.6vw,34px);
  line-height:1.2;
  margin:0 0 27px;
  font-weight:720;
}

.tool p{
  font-size:clamp(19px,3.6vw,27px);
  line-height:1.5;
  color:#b9cce5;
  margin:0 0 24px;
  max-width:510px;
}

/* Tool buttons */

.tool a,.soon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:auto;
  padding:10px 22px;
  border:2px solid;
  border-radius:999px;
  font-size:clamp(16px,3vw,20px);
  font-weight:650;
  line-height:1.2;
  text-decoration:none;
}

.tool a{
  color:#9cecf2;
  border-color:#70dfe9;
  background:rgba(0,25,45,.25);
}

.tool a:hover,.tool a:focus-visible{
  background:rgba(112,223,233,.15);
  color:#ffffff;
}

.soon{
  color:#8da4c1;
  border-color:#607d9f;
  background:rgba(0,20,40,.15);
  cursor:default;
}

/* Footer */

footer{
  text-align:center;
  padding:18px 15px 26px;
  font-size:clamp(16px,3.2vw,22px);
  color:#ffffff;
  text-shadow:0 1px 2px rgba(0,12,28,.65);
}

footer a{
  color:inherit;
  text-decoration:none;
}

footer a:hover{
  text-decoration:underline;
}

.powered{
  margin-top:18px;
  color:#ffffff;
}

/* Mobile */

@media(max-width:550px){
  .hero{
    padding-top:26px;
    padding-bottom:23px;
  }

  .tools{
    gap:18px;
    padding-top:24px;
  }

  .tool{
    min-height:210px;
    padding-top:24px;
    padding-bottom:24px;
    border-radius:17px;
  }

  .tool h2{
    margin-bottom:24px;
  }

  .tool p{
    margin-bottom:24px;
  }
}
</style>
</head>

<body>
<div class="wrap">

<header class="hero">
  <img class="logo" src="eqx-logo.png" alt="Tactical Equinox logo">
  <h1>EQX TOOLS</h1>
</header>

<main class="tools">

  <section class="tool">
    <h2>Battlefield Planner</h2>
    <p>Plan battlefield layouts and share them online.</p>
    <a href="eqx_battlefield_planner_.html">Beta Version</a>
  </section>

  <section class="tool">
    <h2>Team Builder</h2>
    <p>Create character lineups and share them online.</p>
    <a href="team-builder.html">Beta Version</a>
  </section>

</main>

<footer>
  <div>
    Join our community on
    <a href="https://discord.gg/HG8hS52UVP" target="_blank" rel="noopener noreferrer">
      <strong>Discord ↗</strong>
    </a>
  </div>
  <div class="powered">Powered by EQX</div>
</footer>

</div>
</body>
</html>
