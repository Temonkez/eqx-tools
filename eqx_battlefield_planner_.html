<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EQX Battlefield Planner v3.8</title><style>
:root{color-scheme:dark;--bg:#091322;--panel:#11223a;--silver:#e2eaf6;--muted:#a4b8d0;--line:#3c5572;--green:#38c784}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c3859,#091322 70%);color:var(--silver);font:14px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1120px;margin:auto;padding:14px}header{display:flex;align-items:center;gap:12px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:15px}.mark{width:65px;height:65px;object-fit:contain}h1{font:500 clamp(23px,4vw,34px) Georgia,serif;margin:0}header p{margin:3px 0;color:var(--muted);font-size:12px}.panel{background:rgba(17,34,58,.97);border:1px solid var(--line);border-radius:14px;padding:14px}.controls{display:grid;grid-template-columns:1.5fr .6fr 1fr;gap:10px;margin-bottom:12px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;min-height:41px;background:#0a1a2d;color:var(--silver);border:1px solid #506b8c;border-radius:8px;padding:9px}button{background:#284465;color:var(--silver);border:1px solid #607b9b;border-radius:9px;padding:9px 11px;min-height:40px;cursor:pointer}button.primary{background:#e0eaf6;color:#0b1d32;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.danger{color:#ffbfc4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.zone{--tier:#9fadb9;--tint:rgba(159,173,185,.08);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;aspect-ratio:1/1;min-height:0;background:linear-gradient(145deg,var(--tint),#10253d);border:2px solid var(--tier);border-radius:10px;padding:8px 5px 15px;cursor:pointer;text-align:center}.zone:focus-visible{outline:3px solid white}.coord{align-self:flex-start;font-size:11px;color:#d0deee}.zoneName{font-weight:700;font-size:clamp(10px,1.6vw,15px);min-height:24px;display:grid;place-items:center;margin-top:0}.tierName{font-size:12px;font-weight:800;color:var(--tier);margin-top:auto}.bars{display:flex;gap:5px;width:calc(100% - 10px);max-width:none;margin-top:auto;margin-bottom:0;position:absolute;bottom:7px;left:7px;width:calc(100% - 14px)}.bar{height:9px;flex:1;border-radius:3px;background:#41566d}.bar.on{background:#39c783}.count{font-size:11px;color:#d0ddea}.stats{text-align:center;background:#0c1d32;border:1px solid #3b5674;border-radius:10px;margin:13px 0 11px;padding:10px;font-size:15px}.stats strong{font-size:24px;color:#e8ce82}.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-content:center;gap:6px;margin-top:8px}.legendItem{border-left:4px solid var(--tier);background:#0d1e33;padding:7px 5px;border-radius:6px;min-width:0}.legendItem strong{display:block;font-size:clamp(9px,1.8vw,12px)}.legendItem small{font-size:clamp(8px,1.5vw,11px);color:#b6c8dd;line-height:1.2;display:block}.legendBars{font-size:12px;color:#b6c8dd;margin-top:12px}.dot{display:inline-block;width:13px;height:8px;background:#39c783;border-radius:2px;margin-right:4px}.dot.empty{background:#41566d;margin-left:12px}.footer{text-align:center;color:#94a8c1;font-size:11px;margin:14px}.fileInput{display:none}#status{min-height:19px;font-size:12px;color:#a4e8c4}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.dialog{width:min(100%,440px);max-height:92dvh;overflow:auto;background:#152943;border:1px solid #7087a5;border-radius:16px;padding:18px;box-shadow:0 18px 70px #000b}.dialogHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.dialog h2{margin:0;font:500 23px Georgia,serif}.field{margin-top:15px}.stepper{display:flex;gap:10px;align-items:center}.stepper button{width:50px;font-size:22px}.stepper output{flex:1;text-align:center;font-size:20px}.checkline{display:flex;align-items:center;gap:9px;margin-top:15px}.checkline input{width:19px;height:19px;min-height:0}.checkline label{margin:0;font-size:14px;color:var(--silver)}.small{color:var(--muted);font-size:12px;line-height:1.5}.dialogFoot{display:flex;justify-content:flex-end;margin-top:18px}.notice{padding:10px;background:#0b1b2e;border-radius:8px;color:#b9cde1;font-size:12px;margin-top:13px}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.controls .wide{grid-column:1/-1}.panel{padding:10px}.zone{min-height:0}.zoneName{font-size:11px}.tierName{font-size:11px}}@media(max-width:390px){main{padding:9px}.grid{gap:5px}.zone{padding:7px 3px;min-height:0}.zoneName{font-size:10px}.legend{gap:5px}.legendItem{padding:7px}}

/* v3.6: Keep tier labels in normal flow; only defender bars anchor to the bottom. */
.zone{justify-content:flex-start;gap:0;padding-bottom:23px;overflow:hidden}
.zoneName{margin-top:9px;min-height:0;line-height:1.25}
.tierName{margin-top:13px;line-height:1.2;flex-shrink:0}
.zone .bars{position:absolute;left:7px;right:7px;bottom:7px;width:auto;margin:0;max-width:none;z-index:1}
@media(max-width:700px){.zoneName{margin-top:9px}.tierName{margin-top:12px}}
@media(max-width:390px){.zoneName{margin-top:7px}.tierName{margin-top:10px}.zone .bars{left:5px;right:5px;bottom:5px}}

'Landing Pad':['Trooper','Veteran','Veteran','Elite','Elite'],
'Medicae Station':['Trooper','Trooper','Veteran','Veteran','Elite'],
'Supply Depot':['Trooper','Trooper','Veteran','Veteran','Elite'],
'Troop Garrison':['Trooper','Veteran','Veteran','Elite','Elite'],
'Vox-Station':['Trooper','Trooper','Veteran','Veteran','Elite'],
'Warp Rift':['Trooper','Trooper','Veteran','Veteran','Elite']};
const tiers={Trooper:{color:'#b9c5d1',lines:['2× Rare','3× Uncommon']},Veteran:{color:'#e4ba46',lines:['3× Epic','2× Rare']},Elite:{color:'#55d6f1',lines:['2× Legendary','3× Epic']},Hero:{color:'#f07824',lines:['5× Legendary','Uncapped tier']}};
const key='eqx_battlefield_layouts_v1';let layouts={};try{layouts=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){};
const fresh=()=>({title:'Default Layout',level:1,zones:names.map((building,i)=>({building,players:counts[i],tier:'auto',customCap:''}))});let state=fresh(),selected=0;
const zoneId=i=>`${5-Math.floor(i/3)}${'ABC'[i%3]}`,auto=z=>caps[z.building][state.level-1],tier=z=>z.tier&&z.tier!=='auto'?(z.tier==='Legendary x5'?'Hero':z.tier):auto(z),sum=()=>state.zones.reduce((n,z)=>n+z.players,0);
function valid(s){return s&&typeof s.title==='string'&&Number.isInteger(+s.level)&&s.level>=1&&s.level<=5&&Array.isArray(s.zones)&&s.zones.length===15&&s.zones.every((z,i)=>z&&buildings.includes(z.building)&&Number.isInteger(z.players)&&z.players>=0&&z.players<=2&&(!z.tier||['auto','Trooper','Veteran','Elite','Hero','Legendary x5','Custom'].includes(z.tier)))&&s.zones.slice(12).every(z=>z.building==='Frontline')}
function say(msg){$('status').textContent=msg}function persist(){try{localStorage.setItem(key,JSON.stringify(layouts));return true}catch(e){say('Storage unavailable; use Backup JSON.');return false}}
function savedList(){let old=$('saved').value;$('saved').replaceChildren(new Option('Select saved',''));Object.keys(layouts).sort().forEach(n=>$('saved').add(new Option(n,n)));if(layouts[old])$('saved').value=old}
function render(){const grid=$('battlefield');grid.replaceChildren();state.zones.forEach((z,i)=>{const t=tier(z),def=tiers[t]||tiers.Trooper;const cell=document.createElement('div');cell.className='zone';cell.style.setProperty('--tier',def.color);cell.style.setProperty('--tint',def.color+'18');cell.tabIndex=0;cell.setAttribute('role','button');cell.setAttribute('aria-label',`${zoneId(i)} ${z.building}, ${t}, ${z.players} minimum defenders`);const coord=document.createElement('div');coord.className='coord';coord.textContent=zoneId(i);const name=document.createElement('div');name.className='zoneName';name.textContent=z.building;const badge=document.createElement('div');badge.className='tierName';badge.textContent=t;const bars=document.createElement('div');bars.className='bars';for(let j=0;j<2;j++){let b=document.createElement('span');b.className='bar'+(j<z.players?' on':'');bars.append(b)}cell.append(coord,name,badge,bars);cell.onclick=()=>openZone(i);cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openZone(i)}};grid.append(cell)});$('total').textContent=sum();$('title').value=state.title;$('level').value=state.level}
function editSync(){const z=state.zones[selected];$('modalTitle').textContent=`${zoneId(selected)} — ${z.building}`;$('building').value=z.building;$('building').disabled=selected>=12;$('players').textContent=z.players+' / 2';$('autoTier').textContent=auto(z);$('autoTier').style.color=tiers[auto(z)].color;const over=z.tier&&z.tier!=='auto';$('override').checked=!!over;$('overrideFields').hidden=!over;$('tier').value=tiers[z.tier]?z.tier:auto(z)}
function openZone(i){selected=i;editSync();$('modal').classList.add('open');$('close').focus()}function closeZone(){$('modal').classList.remove('open');render()}
$('building').replaceChildren(...buildings.filter(b=>b!=='Frontline').map(b=>new Option(b,b)));
if (z.building === 'Frontline') {
  $('building').add(new Option('Frontline (fixed)', 'Frontline'));
  $('building').value = 'Frontline';
  $('building').disabled = true;
} else {
  $('building').disabled = false;
     }     
$('building').onchange=e=>{if(selected>=12)return;state.zones[selected].building=e.target.value;editSync();render()};$('minus').onclick=()=>{state.zones[selected].players=Math.max(0,state.zones[selected].players-1);editSync();render()};$('plus').onclick=()=>{state.zones[selected].players=Math.min(2,state.zones[selected].players+1);editSync();render()};$('override').onchange=e=>{state.zones[selected].tier=e.target.checked?auto(state.zones[selected]):'auto';editSync();render()};$('tier').onchange=e=>{state.zones[selected].tier=e.target.value;editSync();render()};$('close').onclick=closeZone;$('done').onclick=closeZone;$('modal').onclick=e=>{if(e.target===$('modal'))closeZone()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('open'))closeZone()});$('title').oninput=e=>state.title=e.target.value;$('level').onchange=e=>{state.level=+e.target.value;render()};
$('save').onclick=()=>{state.title=$('title').value.trim()||'Untitled Formation';layouts[state.title]=JSON.parse(JSON.stringify(state));if(persist()){savedList();$('saved').value=state.title;say('Saved “'+state.title+'” on this device.')}};$('load').onclick=()=>{const n=$('saved').value;if(!layouts[n])return say('Choose a saved layout.');state=JSON.parse(JSON.stringify(layouts[n]));render();say('Loaded “'+n+'”.')};$('duplicate').onclick=()=>{state.title=(state.title||'Formation')+' — Copy';render();say('Copy created. Press Save to store it.')};$('delete').onclick=()=>{const n=$('saved').value;if(!layouts[n])return say('Choose a saved layout.');if(!confirm('Delete “'+n+'”?'))return;delete layouts[n];persist();savedList();say('Saved layout deleted.')};$('reset').onclick=()=>{if(!confirm('Reset the unsaved layout to Default Layout?'))return;state=fresh();render();say('Default layout restored.')};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
$('exportJson').onclick=()=>{download(new Blob([JSON.stringify({format:'EQX-Battlefield-Planner-v1',layouts:{...layouts,[state.title||'Current layout']:state}},null,2)],{type:'application/json'}),'eqx_battlefield_backup.json');say('Backup exported.')};$('importJson').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.format!=='EQX-Battlefield-Planner-v1'||!data.layouts)throw Error('Invalid EQX backup');let n=0;for(let [name,layout] of Object.entries(data.layouts)){if(valid(layout)){layouts[name]=layout;n++}}if(!n)throw Error('No valid layouts');persist();savedList();say(`Imported ${n} layout(s).`)}catch(err){say('Import failed: '+err.message)}e.target.value=''};
function drawPng(){
 // Match the editor's square tiles, typography, spacing and legend.
 const W=900, pad=28, inner=844, gap=12, tile=(inner-2*gap)/3;
 const gridTop=132, gridBottom=gridTop+5*tile+4*gap;
 const totalY=gridBottom+26, totalH=86, legendY=totalY+totalH+22;
 const legendH=83, footerY=legendY+legendH+38, H=footerY+54;
 const c=document.createElement('canvas');c.width=W;c.height=Math.ceil(H);
 const ctx=c.getContext('2d');
 const rect=(x,y,w,h,r,fill,stroke,line=0)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}};
 const txt=(t,x,y,size,color='#e2eaf6',weight=500,align='center')=>{ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(t,x,y)};
 ctx.fillStyle='#091322';ctx.fillRect(0,0,W,H);
 rect(14,14,W-28,H-28,21,'#11223a','#526985',2);
 txt(state.title||'EQX Battlefield',W/2,65,31,'#f0f5ff',700,'center');
 txt('BATTLEFIELD LEVEL '+state.level,W/2,94,15,'#a8bdd5',600,'center');
 state.zones.forEach((z,i)=>{
  const x=pad+(i%3)*(tile+gap),y=gridTop+Math.floor(i/3)*(tile+gap);
  const t=tier(z),def=tiers[t]||tiers.Trooper;
  // Mirror the editor's subtle CSS tint (8% rarity colour over navy),
  // rather than painting a bright opaque rarity-coloured gradient.
  const base=[0x11,0x22,0x3a], rgb=[1,3,5].map(n=>parseInt(def.color.slice(n,n+2),16));
  const tint='#'+base.map((v,j)=>Math.round(v*.92+rgb[j]*.08).toString(16).padStart(2,'0')).join('');
  const grad=ctx.createLinearGradient(x,y,x+tile,y+tile);grad.addColorStop(0,tint);grad.addColorStop(1,'#10253d');
  rect(x,y,tile,tile,19,grad,def.color,4);
  txt(zoneId(i),x+13,y+28,19,'#d0deee',500,'left');
  // Editor: building name near the top; tier directly underneath.
  const nameSize=z.building.length>18?18:21;
  txt(z.building,x+tile/2,y+86,nameSize,'#e2eaf6',700);
  txt(t,x+tile/2,y+134,23,def.color,800);
  // Editor bars: full width, just inside the bottom edge.
  const barGap=12,side=17,barW=(tile-2*side-barGap)/2,barH=18,barY=y+tile-34;
  for(let j=0;j<2;j++)rect(x+side+j*(barW+barGap),barY,barW,barH,5,j<z.players?'#39c783':'#41566d');
 });
 rect(pad,totalY,inner,totalH,14,'#0c1d32','#3b5674',2);
 const totalLabel='Minimum defenders:';
 ctx.font='500 29px system-ui,sans-serif';const labelWidth=ctx.measureText(totalLabel).width;
 ctx.font='750 41px system-ui,sans-serif';const numberWidth=ctx.measureText(String(sum())).width;
 const start=(W-labelWidth-12-numberWidth)/2;
 txt(totalLabel,start,totalY+56,29,'#e2eaf6',500,'left');
 txt(String(sum()),start+labelWidth+12,totalY+58,41,'#e8ce82',750,'left');
 const legendGap=10,legendW=(inner-3*legendGap)/4;
 Object.entries(tiers).forEach(([name,t],i)=>{
  const x=pad+i*(legendW+legendGap);
  rect(x,legendY,legendW,legendH,10,'#0d1e33');
  rect(x,legendY,7,legendH,4,t.color);
  txt(name,x+19,legendY+29,21,'#e2eaf6',700,'left');
  t.lines.forEach((line,j)=>txt(line,x+19,legendY+51+j*18,15,'#b6c8dd',500,'left'));
 });
 const logo=$('eqxLogo');
 const footerText='Powered by Tactical Equinox';
 ctx.font='600 18px system-ui,sans-serif';const footW=ctx.measureText(footerText).width;
 const footX=(W-footW-31)/2;
 if(logo.complete&&logo.naturalWidth)ctx.drawImage(logo,footX,footerY-17,23,23);
 txt(footerText,footX+31,footerY+2,18,'#e4cc82',600,'left');
 c.toBlob(b=>{if(b){download(b,'EQX_'+(state.title||'battlefield').replace(/[^a-z0-9]+/gi,'_').slice(0,40)+'.png');say('PNG exported.')}else say('PNG export failed.')},'image/png');
}
$('png').onclick=drawPng;const legend=$('legend');Object.entries(tiers).forEach(([name,t])=>{const el=document.createElement('div');el.className='legendItem';el.style.setProperty('--tier',t.color);const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent='';t.lines.forEach((line,i)=>{if(i)small.append(document.createElement('br'));small.append(document.createTextNode(line))});el.append(strong,small);legend.append(el)});savedList();render();
})();
